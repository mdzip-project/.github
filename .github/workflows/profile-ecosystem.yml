# Keep the org profile's "ecosystem at a glance" table and its download
# badges (profile/README.md) in step with the registry mdzip.org publishes
# (https://mdzip.org/ecosystem.json). When they would change, this opens a
# pull request and merges it: the registry is the reviewed source (edited and
# reviewed in the mdzip.org repo), and an unmerged PR once left the profile
# out of date for two weeks (mdzip-project/.github#4). The PR touches only
# profile/README.md, and only the parts tools/profile-ecosystem.mjs generates.

name: Update profile ecosystem table

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Regenerate the table from mdzip.org/ecosystem.json
        run: node tools/profile-ecosystem.mjs

      - name: Open a pull request if it changed
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/profile-ecosystem
          commit-message: "docs(profile): update ecosystem table from mdzip.org/ecosystem.json"
          title: "Update the profile's ecosystem table"
          body: |
            The ecosystem registry published at https://mdzip.org/ecosystem.json changed, so the generated parts of `profile/README.md` (the "ecosystem at a glance" table and the download badges in the Release status table) were regenerated by `tools/profile-ecosystem.mjs`.

            The registry is edited in the mdzip.org repo (`templates/ecosystem.json`). This workflow merges the PR itself.
          add-paths: profile/README.md
          delete-branch: true

      # Auto-merge waits for required checks; with none, GitHub refuses to
      # queue it on a PR that can already merge, so fall back to merging now.
      - name: Merge the pull request
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --squash --auto || gh pr merge "$PR" --squash
