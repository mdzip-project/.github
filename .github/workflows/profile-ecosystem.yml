# Keep the org profile's "ecosystem at a glance" table (profile/README.md) in
# step with the registry mdzip.org publishes (https://mdzip.org/ecosystem.json).
# When the table would change, this opens a pull request for review rather
# than pushing: nothing goes live without the owner merging it.

name: Update profile ecosystem table

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate the table from mdzip.org/ecosystem.json
        run: node tools/profile-ecosystem.mjs

      - name: Open a pull request if it changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/profile-ecosystem
          commit-message: "docs(profile): update ecosystem table from mdzip.org/ecosystem.json"
          title: "Update the profile's ecosystem table"
          body: |
            The ecosystem registry published at https://mdzip.org/ecosystem.json changed, so the "ecosystem at a glance" table in `profile/README.md` was regenerated by `tools/profile-ecosystem.mjs`.

            The registry is edited in the mdzip.org repo (`templates/ecosystem.json`).
          add-paths: profile/README.md
          delete-branch: true
